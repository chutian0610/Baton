name: npm publish

# Publishing follows the version tags: cutting a v* tag runs the full test
# suite and publishes to npm via Trusted Publishing (OIDC) — no token secret
# required. The package's Trusted Publisher settings on npmjs.com must list
# this repository (chutian0610/Baton) and this workflow file (npm-publish.yml).

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm publish
